name: Gate

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Full gate
    runs-on: ubuntu-26.04 # podman 5.7.0 = K11's floor
    timeout-minutes: 30
    steps:
      - name: Check out the repository with its history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: false

      - name: Install uv (runs zizmor)
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: false

      - name: Start a user systemd manager (scope teardown tests)
        shell: bash
        run: |
          sudo loginctl enable-linger "$(id -un)"
          for _ in $(seq 50); do
            if [ -S "/run/user/$(id -u)/systemd/private" ]; then exit 0; fi
            sleep 0.2
          done
          echo "no user manager socket under /run/user/$(id -u)" >&2
          exit 1

      - name: Run the full gate
        env:
          GOTOOLCHAIN: local
          OFFLOAD_REQUIRE_SCOPE: "1"
          OFFLOAD_REQUIRE_PODMAN: "1"
        run: .agent/gate
