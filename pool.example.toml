# Copy to ~/.config/offload/pool.toml (or point OFFLOAD_CONFIG at it).
# One [[host]] table per machine; `address` = [user@]host or an ~/.ssh/config alias.
# multiplex = one shared SSH connection per host (faster starts; sockets in $XDG_RUNTIME_DIR/offload/ssh).
[[host]]
name = "nixbox"
address = "offload@192.168.40.240"
slots = 2
multiplex = true
